apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  labels:
    app: portfolio-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
      annotations:                                    # ← ДОБАВЬ ЭТИ 3 СТРОКИ
        prometheus.io/scrape: "true"                  # Включить сбор метрик
        prometheus.io/port: "3000"                    # Порт метрик
        prometheus.io/path: "/metrics"                # Путь к метрикам
    spec:
      containers:
      - name: app
        image: ghcr.io/tohnoky/node-portfolio:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: portfolio-app-config
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portfolio-app-secret
              key: REDIS_PASSWORD
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: portfolio-app-secret
              key: API_KEY
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
