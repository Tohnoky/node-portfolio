apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  labels:
    app: portfolio-app
spec:
  replicas: 2                                    # ← 2 копии приложения!
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
    spec:
      containers:
      - name: app
        image: ghcr.io/tohnoky/node-portfolio:latest   # ← Твой образ из GHCR!
        imagePullPolicy: Always                         # Всегда тянуть свежий образ
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: REDIS_HOST
          value: "portfolio-redis"                      # ← Имя Service из K8s!
        - name: REDIS_PORT
          value: "6379"
        # Liveness probe: "Жив ли контейнер?" (аналог HEALTHCHECK)
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        # Readiness probe: "Готов ли принимать трафик?"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # Ресурсы (важно для production!)
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
