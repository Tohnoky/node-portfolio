apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: portfolio.local     # ← Наш "домен"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-app  # ← Имя нашего Service
            port:
              number: 3000
